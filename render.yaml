services:
  - type: web
    name: finance-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node --experimental-sqlite src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/finance.sqlite
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: finance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
